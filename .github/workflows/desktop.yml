name: Desktop

# Build, lint and test the native GPUI desktop app (crate `flightdeck-desktop`).
# The root CI workflow (ci.yml) deliberately covers only the TUI: the root
# workspace has `default-members = ["."]`, so its `cargo clippy/test` never touch
# the GUI's ~1000-crate GPUI graph. This workflow is the GUI's gate.
#
# `cargo fmt --all --check` in ci.yml already formats `desktop/` too (--all walks
# every workspace member), so there is no separate fmt job here.
#
# The `package` job (manual workflow_dispatch only, never on PRs) produces the
# UNSIGNED per-OS artifacts; see desktop/PACKAGING.md.
#
# The `build-release` + `publish` jobs run on `desktop-v<x.y.z>` tag pushes (and on
# workflow_dispatch with a `tag` input) and attach the assets the desktop self-updater
# looks for (names: desktop/src/selfupdate/release.rs) to a GitHub Release. Signing steps
# are gated on repository secrets and skipped when those are unset.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: ["main"]
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Also build unsigned installers/bundles for each OS"
        type: boolean
        default: true
      tag:
        description: "Release tag to build and publish (desktop-v<x.y.z>, must already exist). Empty: no release."
        type: string
        default: ""

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GPUI + gpui-component is a cold ~5-10 minute build per OS.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The GUI, unlike the TUI, is not pure Rust. Linux needs the display-server,
      # font and Vulkan dev libraries plus cmake/clang (list from desktop/NOTES-M0.md);
      # macOS uses the crate's default `runtime-shaders` feature so no Metal Toolchain
      # is needed; the Windows runner image already carries MSVC + the Windows SDK
      # (fxc.exe, rc.exe) that gpui-pre-windows' build script needs.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan1 mesa-vulkan-drivers xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the GUI's large target dir apart from ci.yml's caches.
          prefix-key: desktop-v1

      - name: Clippy
        run: cargo clippy -p flightdeck-desktop --all-targets --locked -- -D warnings

      # GPUI tests run on its headless TestPlatform and open no real window, so they
      # should not need a display. The Linux run is wrapped in xvfb-run anyway as
      # cheap insurance (an X server is only touched if some test path initialises the
      # real platform); drop the wrapper once a green run proves it unnecessary.
      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p flightdeck-desktop --locked
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test -p flightdeck-desktop --locked

      # The debug snapshot feature pulls in gpui's test-support in the real binary;
      # one OS is enough to prove it still compiles.
      - name: Build with spike-snapshot (macOS only)
        if: runner.os == 'macOS'
        run: cargo build -p flightdeck-desktop --features spike-snapshot --locked

      - name: Release build
        if: runner.os == 'macOS'
        run: cargo build -p flightdeck-desktop --release --locked

  # Manual only: unsigned artifacts per OS. Signing/notarization inputs are
  # intentionally not wired here; add secrets as env on the relevant step when the
  # owner has the identities (see desktop/PACKAGING.md).
  package:
    name: package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.package && inputs.tag == ''
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan1 mesa-vulkan-drivers file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: desktop-v1

      # --- macOS: unsigned FlightDeck.app + zip ---
      - name: Bundle macOS app (unsigned)
        if: runner.os == 'macOS'
        run: scripts/desktop/macos-bundle.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: flightdeck-desktop-macos-unsigned
          path: |
            target/desktop-dist/*.zip
            target/desktop-dist/*.sha256

      # --- Linux: .deb, .rpm, AppImage ---
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
      - name: Build release binary (Linux)
        if: runner.os == 'Linux'
        run: cargo build -p flightdeck-desktop --release --locked
      - name: Package .deb / .rpm / AppImage (unsigned)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SKIP_BUILD: "1"
        run: |
          mkdir -p target/desktop-dist
          cargo deb -p flightdeck-desktop --no-build --output target/desktop-dist/
          cargo generate-rpm -p desktop --target-dir target --output target/desktop-dist/
          LINUXDEPLOY="$PWD/linuxdeploy" scripts/desktop/linux-appimage.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: flightdeck-desktop-linux-unsigned
          path: |
            target/desktop-dist/*.deb
            target/desktop-dist/*.rpm
            target/desktop-dist/*.AppImage
            target/desktop-dist/*.sha256

      # --- Windows: MSI via WiX v3 ---
      - name: Install cargo-wix
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked
      - name: Package MSI (unsigned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/desktop/windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flightdeck-desktop-windows-unsigned
          path: |
            target/desktop-dist/*.msi
            target/desktop-dist/*.zip
            target/desktop-dist/*.sha256

  # Tag-driven release. Builds every asset the self-updater expects, checks the names,
  # then `publish` attaches them all to one GitHub Release. Runs `check` first so a
  # tag never ships a red build.
  build-release:
    name: release build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: check
    strategy:
      # First release: one broken OS leg must not stop the others from publishing.
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-latest, asset_os: macos }
          - { name: macos-x86_64, os: macos-15-intel, asset_os: macos }
          - { name: linux-x86_64, os: ubuntu-latest, asset_os: linux }
          - { name: windows-x86_64, os: windows-latest, asset_os: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Optional signing material. Unset secrets expand to "", which the scripts and the
      # gated steps below treat as "skip signing".
      # The CODESIGN_* secrets are shared with the TUI's cargo-dist release (release.yml).
      CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
      CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      # Notarization (optional): App Store Connect API key (preferred) ...
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      # ... or an Apple ID with an app-specific password.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag must match the crate version
        shell: bash
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' desktop/Cargo.toml | head -1)"
          if [[ "$RELEASE_TAG" != "desktop-v$version" ]]; then
            echo "tag $RELEASE_TAG does not match desktop/Cargo.toml version $version (expected desktop-v$version)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan1 mesa-vulkan-drivers file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: desktop-v1

      # --- macOS: FlightDeck-<v>-macos-<arch>.zip (+ .sha256) ---
      # Import the Developer ID certificate only when the secret is set; the bundle
      # script then signs (and notarizes if the notary credentials are set too).
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.CODESIGN_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CODESIGN_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      # Write the App Store Connect API key (.p8) to a temp file for notarytool.
      - name: Decode notarization API key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: scripts/desktop/macos-bundle.sh

      # --- Linux: FlightDeck-<v>-linux-<arch>.AppImage (+ .sha256), .deb, .rpm ---
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
      - name: Build release binary (Linux)
        if: runner.os == 'Linux'
        run: cargo build -p flightdeck-desktop --release --locked
      - name: Package .deb / .rpm / AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SKIP_BUILD: "1"
        run: |
          mkdir -p target/desktop-dist
          cargo deb -p flightdeck-desktop --no-build --output target/desktop-dist/
          cargo generate-rpm -p desktop --target-dir target --output target/desktop-dist/
          LINUXDEPLOY="$PWD/linuxdeploy" scripts/desktop/linux-appimage.sh

      # --- Windows: portable zip (+ .sha256) and MSI ---
      - name: Decode Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          "WINDOWS_SIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install cargo-wix
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked
      - name: Package portable zip and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/desktop/windows-package.ps1

      - name: Check asset names against the updater contract
        shell: bash
        env:
          ASSET_OS: ${{ matrix.asset_os }}
        run: scripts/desktop/check-asset-names.sh --os "$ASSET_OS" --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/desktop-dist/FlightDeck-*.zip
            target/desktop-dist/FlightDeck-*.AppImage
            target/desktop-dist/*.sha256
            target/desktop-dist/*.msi
            target/desktop-dist/*.deb
            target/desktop-dist/*.rpm

  # Runs even when some build-release legs failed, so a first release still ships
  # whatever was built (e.g. macOS when the never-run Linux/Windows legs break). The
  # job fails at the end, after uploading, so the gap is visible.
  publish:
    name: publish GitHub Release
    needs: build-release
    if: ${{ always() && needs.build-release.result != 'skipped' && needs.build-release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      BUILD_RESULT: ${{ needs.build-release.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -l dist
      # Create the release if it does not exist, then upload (re-runs replace assets).
      # - A SemVer pre-release (desktop-v0.2.0-beta.1) is created as a pre-release,
      #   which the self-updater ignores; any other version is offered to users.
      # - Never "Latest": that marker belongs to the CLI, whose documented install
      #   (`releases/latest/download/flightdeck-installer.sh`) must keep resolving.
      # - Notes are the version's section of desktop/CHANGELOG.md
      #   (scripts/release-desktop writes it), else GitHub's generated notes.
      - name: Create release and upload assets
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            version="${RELEASE_TAG#desktop-v}"
            flags=(--latest=false)
            if [[ "$version" == *-* ]]; then
              flags+=(--prerelease)
            fi
            if scripts/desktop/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"; then
              flags+=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              flags+=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "FlightDeck Desktop ${version}" "${flags[@]}"
          fi
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release assets were built" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Fail if any build leg failed
        if: ${{ env.BUILD_RESULT != 'success' }}
        run: |
          echo "build-release result: $BUILD_RESULT. Assets that were built have been published; the release is incomplete." >&2
          exit 1
