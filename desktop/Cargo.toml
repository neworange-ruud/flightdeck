[package]
name = "flightdeck-desktop"
version = "0.1.1"
edition = "2021"
description = "Native desktop front-end for FlightDeck, built on GPUI."
repository = "https://github.com/neworange-ruud/flightdeck"
license = "MIT"
publish = false

[[bin]]
name = "flightdeck-desktop"
path = "src/main.rs"

# Not a release artifact yet: cargo-dist reads every member of the root
# workspace (dist-workspace.toml has `members = ["cargo:."]`), and without this
# it would start building installers for the GUI next to the TUI.
[package.metadata.dist]
dist = false

[features]
# Compile GPUI's Metal shaders when the app starts instead of at build time.
# On by default because the build-time path shells out to Apple's `metal`
# compiler, which since Xcode 26 is a separate download
# (`xcodebuild -downloadComponent MetalToolchain`) that most machines — and CI
# runners — do not have; without it `cargo build` fails in gpui-pre-apple's
# build script. The run-time cost is a one-off shader compile at each launch.
# Release packaging should build with `--no-default-features`
# on a machine that has the Metal Toolchain, to ship precompiled shaders.
# No effect on Windows or Linux.
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]
# Debug aid, off by default: adds `--spike-snapshot PATH` to the terminal spike,
# which renders the window's own frame offscreen (GPUI's `render_to_image`,
# only compiled with its test-support) and writes it as a PPM image. That
# checks the pixels the element paints without screen-recording permission.
spike-snapshot = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
# The TUI's library crate: config, git/worktree plumbing and the agent model the
# GUI will drive. The M0 scaffold does not call into it yet; the dependency is
# here now so the workspace/lock layout is settled from the first commit and
# the GUI build proves the library links on its own.
flightdeck = { path = ".." }

# --- GPUI -------------------------------------------------------------------
# GPUI is consumed through `gpui-pre`, the crates.io snapshot of Zed's `gpui`
# that the Zed team republishes roughly weekly (same repo, same Apache-2.0
# licence). It is pinned EXACTLY because gpui-component pins it exactly
# (`=0.3.7`): a looser requirement here could only ever resolve to that one
# version anyway, and saying so makes an upgrade a deliberate, reviewed edit.
# Renamed to `gpui` so code reads like every GPUI example, and so the rename is
# the only line that changes if we ever move to the upstream `gpui` crate name.
# See desktop/NOTES-M0.md for the rejected candidates (crates.io `gpui` 0.2.x,
# `gpui-ce`, a zed git rev) and the upgrade policy.
gpui = { package = "gpui-pre", version = "=0.3.7" }
# Since Zed's platform split, `gpui` itself holds no windowing backend; this
# crate selects the per-OS one (Cocoa+Metal, Win32+DirectX, X11/Wayland+wgpu)
# and exposes `application()`. Its default feature set is empty, so we name:
#   font-kit     — CoreText font loading on macOS,
#   wayland, x11 — both Linux display servers; GPUI picks one at run time.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = [
    "font-kit",
    "wayland",
    "x11",
] }
# The widget/theme layer on top of GPUI (buttons, lists, inputs, dock, and the
# `Root` view that hosts dialogs and notifications). It pins gpui-pre `=0.3.7`,
# which is what fixes the GPUI version above. Default features only: the
# tree-sitter grammars are opt-in and each one is a C build.
gpui-component = "0.7.0"
# `Action::build` (constructing an action from keymap JSON) takes a JSON value
# and returns an anyhow error; `keys::KeymapAction` implements it by hand.
# Both are already in the graph through gpui and the TUI library.
anyhow = "1.0.102"
serde_json = "1.0.150"
# The pairing and web-access QR codes are drawn natively (GPUI quads) from the
# modules of this matrix, not from the TUI's half-block art. Already in the
# graph through the TUI library; no image or SVG renderers wanted.
qrcode = { version = "0.14", default-features = false }
# SHA-256 for verifying a downloaded update against its published checksum.
# The same RustCrypto crate and version the TUI library already uses.
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock tile's badge (the "needs you" count): `NSApp.dockTile.badgeLabel`,
# which GPUI does not expose. The versions its macOS platform already builds
# against, so no new crate enters the dependency tree.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
# The same gpui, plus its headless test platform (`TestAppContext`,
# `VisualTestContext::simulate_keystrokes`), so the keyboard tests dispatch
# through real key contexts and the real input-handler path without a window
# server. Dev-only: feature unification (resolver 2) keeps `test-support` out
# of the shipped binary.
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
# The TUI's key event type, so the chord matrix can prove the GUI sends the
# same bytes as `flightdeck::tui::input::encode_key` for the same key.
crossterm = "0.29.0"
# The configuration-manager fixtures build the manager from empty TOML tables.
toml = "1.1.2"
# The TUI library again, with its off-by-default `testing` feature: an
# `AppHost` built over the core's fakes, so the shell's GPUI tests drive real
# views against a real host. Dev-only, like `test-support` above.
flightdeck = { path = "..", features = ["testing"] }
# A folder that is no git repository, for the Open Project refusal test.
# Already in the lock through the root crate's dev-dependencies.
tempfile = "3.27.0"

# --- Packaging metadata (see desktop/PACKAGING.md) ---------------------------
# Linux .deb: `cargo install cargo-deb && cargo deb -p flightdeck-desktop --no-build`
# after a release build. Asset sources are relative to this crate (desktop/), except
# the binary, which lives in the workspace target dir.
[package.metadata.deb]
name = "flightdeck-desktop"
maintainer = "New Orange <ruud.vanfalier@neworange.agency>"
copyright = "New Orange"
license-file = ["../LICENSE", "0"]
section = "devel"
priority = "optional"
extended-description = "Native desktop front-end for FlightDeck: orchestrate AI coding agents across git worktrees."
# Runtime deps: input/windowing libs for X11 and Wayland, fonts, and a Vulkan loader
# (wgpu renders through Vulkan; mesa-vulkan-drivers or a vendor driver supplies the ICD).
depends = "libc6, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libxcb1, libfontconfig1, libfreetype6, libvulkan1, mesa-vulkan-drivers | vulkan-icd"
assets = [
    ["../target/release/flightdeck-desktop", "usr/bin/", "755"],
    ["packaging/linux/flightdeck-desktop.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/flightdeck-16.png", "usr/share/icons/hicolor/16x16/apps/flightdeck-desktop.png", "644"],
    ["packaging/icons/flightdeck-32.png", "usr/share/icons/hicolor/32x32/apps/flightdeck-desktop.png", "644"],
    ["packaging/icons/flightdeck-48.png", "usr/share/icons/hicolor/48x48/apps/flightdeck-desktop.png", "644"],
    ["packaging/icons/flightdeck-64.png", "usr/share/icons/hicolor/64x64/apps/flightdeck-desktop.png", "644"],
    ["packaging/icons/flightdeck-128.png", "usr/share/icons/hicolor/128x128/apps/flightdeck-desktop.png", "644"],
    ["packaging/icons/flightdeck-256.png", "usr/share/icons/hicolor/256x256/apps/flightdeck-desktop.png", "644"],
    ["packaging/icons/flightdeck-512.png", "usr/share/icons/hicolor/512x512/apps/flightdeck-desktop.png", "644"],
]

# Linux .rpm: `cargo install cargo-generate-rpm && cargo generate-rpm -p desktop`
# after a release build, run from the repo root (asset sources are relative to it).
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/flightdeck-desktop", dest = "/usr/bin/flightdeck-desktop", mode = "755" },
    { source = "desktop/packaging/linux/flightdeck-desktop.desktop", dest = "/usr/share/applications/flightdeck-desktop.desktop", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/flightdeck-desktop.png", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/flightdeck-desktop.png", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/flightdeck-desktop.png", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/flightdeck-desktop.png", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/flightdeck-desktop.png", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/flightdeck-desktop.png", mode = "644" },
    { source = "desktop/packaging/icons/flightdeck-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/flightdeck-desktop.png", mode = "644" },
]
[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libxkbcommon-x11 = "*"
fontconfig = "*"
freetype = "*"
vulkan-loader = "*"

# Windows .msi: `cargo wix -p flightdeck-desktop` (WiX v3 + cargo-wix). Template: wix/main.wxs.
[package.metadata.wix]
upgrade-guid = "6D0B5A57-6B0C-4F3E-9C55-2E1F3A6B7D10"
path-guid = "0E8C2C4B-58D2-4D6B-8F7A-4B7E1F9A3C21"
license = false
eula = false
