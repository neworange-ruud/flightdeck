[package]
name = "flightdeck"
version = "1.16.0"
edition = "2021"
description = "A cross-platform terminal UI for orchestrating multiple local AI coding agents in isolated Git worktrees."
repository = "https://github.com/neworange-ruud/flightdeck"
homepage = "https://github.com/neworange-ruud/flightdeck"
readme = "README.md"
license = "MIT"
keywords = ["ai", "agents", "git", "tui", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "flightdeck"
path = "src/lib.rs"

[[bin]]
name = "flightdeck"
path = "src/main.rs"

[features]
# On by default: self-update (`flightdeck update`) and the update notice.
# Its dependency graph pulls in `aws-lc-sys` (a C crypto library) which needs a C
# toolchain, so it is excluded two ways: by feature (`--no-default-features` for a
# pure-Rust graph, e.g. the self-contained windows-gnu target with no
# MSVC/CMake/NASM), and — even with the feature on — on Windows, where the
# updater deps are target-gated out (see the `[target.'cfg(not(windows))']`
# table) so the released windows-msvc binary stays pure-Rust. See src/update.rs.
default = ["self-update"]
# `tokio` is deliberately NOT listed here any more: since the relay client moved
# onto tokio-tungstenite (specs/WEB_INTERFACE.md D6) the runtime is a core,
# non-optional dependency on every target, so `--no-default-features` still
# builds a working relay client — it only drops the updater.
self-update = ["dep:axoupdater"]

[dependencies]
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.2"
toml_edit = "0.25.13"
vt100 = "0.16.2"

# --- FlightDeck Remote (relay client, src/remote/) -------------------------
# Shared phone<->desktop wire types. Path dep into the sibling `remote/`
# workspace; the desktop and the relay build the exact same frames from it and
# the iOS app mirrors them in Swift. JSON wire format via serde/serde_json above.
flightdeck-remote-protocol = { path = "remote/protocol" }
# Async WebSocket client for the long-lived relay connection. tokio-tungstenite
# (NOT the blocking `tungstenite`) since specs/WEB_INTERFACE.md D6: the desktop
# now owns ONE tokio runtime (src/remote/runtime.rs) shared by the relay client
# and the embedded web server, so both remote transports speak the same idioms
# and neither needs its own runtime. Default features give `connect` (the
# `connect_async`/`client_async_tls` helpers) + `handshake`; TLS (wss) is added
# per-platform below (rustls off-Windows, SChannel on Windows) so neither target
# needs a C toolchain — see the two target tables. The crate re-exports the
# `tungstenite` types (`Message`, `Error`), so this line adds no *third*
# implementation of its own.
#
# There ARE two tungstenite versions in the desktop graph, deliberately: this
# 0.30 as the relay CLIENT, and 0.29 pulled in by `axum`'s `ws` feature for the
# web server's handshake (see the `axum` entry below). Unifying them would mean
# pinning axum to whatever version happens to match, or hand-rolling the RFC 6455
# server upgrade; neither is worth it, and the duplication costs binary size
# only. Do not "fix" it by downgrading the relay client — the client half is the
# one carrying E2E transport code with three P0 bugs behind it.
tokio-tungstenite = "0.30"
# The shared async runtime (src/remote/runtime.rs). Unconditional and
# non-optional on every platform: the relay client cannot run without it, and
# `src/web/server.rs` (axum) spawns onto the same runtime rather than starting a
# second one. `rt-multi-thread` for the shared runtime, `net` for the relay
# socket, `time` for the ping/liveness/backoff timers, `sync` for the watch +
# mpsc channels that bridge the synchronous TUI to the async session, `io-util`
# for tokio-tungstenite's stream adapters, `macros` for the `select!`/`pin!` the
# relay session is built on — listed explicitly rather than inherited from
# axoupdater's graph, which `--no-default-features` removes. Also drives
# axoupdater's async `query_new_version` from the update-check thread
# (src/update.rs), which is why a current-thread runtime used to be enough there.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
# `Stream`/`Sink` combinators for the relay socket: `split()` so the session can
# read frames in a `select!` while its handlers write acks/resumes, plus
# `StreamExt::next` / `SinkExt::send`. `default-features = false` keeps it off
# the futures-executor/io stack we do not use; `sink` is what `split()` needs.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Per-device identity: ECDSA over NIST P-256 with SHA-256 (spec §5.1). P-256 is
# mandated by the protocol because the iPhone key is Secure-Enclave-resident and
# the Enclave only speaks P-256; the desktop must use the same curve to be
# verifiable by the relay. `ecdsa` enables sign/verify; `ecdh` enables the
# static-static P-256 key agreement that seeds the E2E channel (spec §7, src/remote/crypto.rs).
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
# E2E channel key derivation: HKDF-SHA256 over the P-256 ECDH shared secret
# (spec §7). Pure-Rust RustCrypto crate, same family/versions as p256+sha2, so
# it adds no C toolchain and keeps the Windows build pure-Rust. sha2 above is the
# hash; hkdf provides extract+expand.
hkdf = "0.12"
# E2E authenticated encryption: ChaCha20-Poly1305 AEAD (spec §7). Pure-Rust
# RustCrypto crate; chosen over AES-GCM because it needs no hardware AES and is
# constant-time in software, matching CryptoKit's `ChaChaPoly` on the iOS side so
# the two platforms produce byte-identical ciphertext. 12-byte nonce per message.
chacha20poly1305 = "0.10"
# Device id = SHA-256 of the X9.63 public key (matches the iOS convention).
sha2 = "0.10"
# QR code generation for the desktop pairing overlay (Settings → Remote). The
# `fdr1:` payload is encoded and rendered as terminal half-block cells (spec
# §5.2, src/remote/pairing.rs). `default-features = false` drops the optional
# `image`/`svg` renderers we do not use, keeping the graph pure-Rust with no C
# toolchain (matching the rest of the remote crypto stack).
qrcode = { version = "0.14", default-features = false }
# Wire encodings: standard-padded base64 for keys/signatures/nonces/ciphertext
# (spec §2/§5.1) and url-safe-no-pad for the device id.
base64 = "0.22"
# CSPRNG for P-256 key generation (OsRng) and backoff jitter. rand_core 0.6 is
# the version p256/ecdsa expect, so one dependency serves both.
rand_core = { version = "0.6", features = ["getrandom"] }

# --- FlightDeck Web (embedded browser control surface, src/web/) -----------
# See specs/WEB_INTERFACE.md. `tokio` above is the runtime the web server shares
# with the relay client (D6); `axum` itself arrives with src/web/server.rs. The
# crates below are the leaf dependencies of the modules that need no runtime.
#
# Constant-time comparison for the bootstrap code and the persistent token
# (Q4). The relay already reaches for `subtle` for exactly this, so the desktop
# uses the same crate rather than hand-rolling a comparison that an optimiser is
# free to short-circuit.
subtle = "2.6"
# The `webui/` SPA is baked into the binary so a release stays a single file and
# the server never resolves paths on disk (D9). `mime-guess` attaches a content
# type to each embedded file, which the asset route serves verbatim.
rust-embed = { version = "8", features = ["mime-guess"] }
# The HTTP + WebSocket server itself (D6, src/web/server.rs). `default-features
# = false` because axum's defaults carry `form`/`query`/`multipart`-adjacent
# extractors, `matched-path`, `original-uri`, `tower-log` and `tracing` that this
# server has no route for; what it needs is exactly four:
#   http1 — the only protocol a browser needs over a loopback/LAN socket (no h2:
#           it buys multiplexing we do not use and a larger graph),
#   json  — the credential-exchange request/response bodies (Q4),
#   tokio — `axum::serve` + `ConnectInfo`, so the peer's real socket address is
#           available to the per-address rate limiter,
#   ws    — the `/ws` upgrade that protocol v1 rides on (D12).
#
# **This does add a second WebSocket implementation to the graph**, which the
# `tokio-tungstenite` note above previously claimed did not exist: axum's `ws`
# feature pins tokio-tungstenite 0.29 for the *server* handshake, while
# `src/remote/client.rs` keeps the 0.30 it uses as a *client*. The two
# never meet — different direction, different socket, no shared types — and the
# alternative (hand-rolling the RFC 6455 server upgrade against 0.30 so the
# versions unify) would mean owning the handshake, masking and framing code that
# is the one part of a WebSocket server nobody should write twice.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
# Network-interface enumeration for the access overlay's address picker (Q1.2).
# Pure Rust over getifaddrs/GetAdaptersAddresses, so it adds no C toolchain and
# behaves the same on macOS, Linux and Windows — the parity requirement in
# .agents/skills/flightdeck-cross-platform-parity. Classification (wifi / bridge
# / tunnel) is our own heuristic on top of the names it returns; see
# src/web/interfaces.rs.
if-addrs = "0.13"

# Deps built on every platform EXCEPT Windows: the self-updater, rustls (the
# relay client's TLS backend off Windows) and rusqlite. Target-gating them here
# (rather than only behind a feature) keeps the Windows build pure-Rust even when
# the default features are enabled: each of these graphs pulls in a C library
# (`aws-lc-sys`, SQLite) that would otherwise need a C toolchain on the
# windows-msvc release runner. On Windows the `update` module falls back to a
# no-op stand-in (see src/lib.rs) and TLS comes from SChannel instead — see the
# `cfg(windows)` table below.
[target.'cfg(not(windows))'.dependencies]
# Self-update for installer-based installs (`flightdeck update`). The `blocking`
# feature exposes the `*_sync` methods so a caller needs no runtime of its own;
# `github_releases` (a default feature) points the updater at our GitHub
# Releases. See src/update.rs, which drives its one async call on a
# current-thread runtime of its own (it predates the shared runtime).
axoupdater = { version = "0.10", features = ["blocking"], optional = true }
# TLS (wss) for the relay client off Windows: rustls with the webpki root store,
# feature-unified with the base `tokio-tungstenite` above. This is target-gated
# rather than unconditional because rustls 0.23 resolves its crypto provider to
# `aws-lc-rs` -> `aws-lc-sys` (a C library needing cmake + NASM on windows-msvc),
# which would break the pure-Rust release runner the same way axoupdater's graph
# does. Windows gets the same `wss` support through SChannel instead — see the
# `cfg(windows)` table below.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tungstenite 0.30 declares rustls with `default-features = false`, so NO crypto
# provider is selected by the WebSocket crates themselves and
# `ClientConfig::builder()` would panic at run time ("no process-level
# CryptoProvider available") on the first `wss://` connect. Naming the provider
# here — feature-unified into the same rustls — is what keeps that from being a
# runtime panic in the relay thread. `aws-lc-rs` is rustls' own default and is
# exactly what tungstenite 0.24 pulled in before the tokio port, so the
# off-Windows dependency graph is unchanged; it is also why this table, and not
# the shared one, is where rustls may appear at all.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
# OpenCode moved its conversation store from per-message JSON files to a single
# live SQLite DB (`~/.local/share/opencode/opencode.db`, WAL mode). Rebuilding an
# OpenCode agent's remote chat means reading that DB (remote-control-fyj), and
# correct reads of a *live WAL* database need real SQLite (recent writes live in
# the `-wal` sidecar, which a naive file reader would miss). `bundled` compiles
# SQLite from source (JSON1 included) — no system libsqlite3 requirement. Windows
# is excluded, like the TLS/self-update C stack above, to keep the released
# windows-msvc binary pure-Rust; OpenCode transcript reconstruction is therefore
# a non-Windows desktop feature (on Windows the chat stays empty, as before). We
# open the DB READ-ONLY and never write to it (see src/remote/opencode.rs).
rusqlite = { version = "0.32", features = ["bundled"] }

# TLS (wss) for the relay client on Windows (remote-control-2jy). `native-tls`
# resolves to SChannel (the OS TLS stack) via the pure-Rust `schannel` crate, so
# `wss://` works here without dragging in the aws-lc C toolchain that rules
# rustls out on windows-msvc (see the `cfg(not(windows))` table above).
# Feature-unified with the base `tokio-tungstenite`; only one of the two TLS
# backends is ever enabled for a given target, so `client_async_tls`'s
# no-connector path is unambiguous and `MaybeTlsStream` has exactly one TLS arm.
[target.'cfg(windows)'.dependencies]
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

# POSIX-only: shutdown-signal handling (run teardown on SIGTERM/SIGINT) and the
# raw kill(2)/killpg used for graceful, process-group agent termination.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
# `#[tokio::test]` needs tokio's test macro (`macros`, already on for `select!`)
# plus a current-thread runtime to drive each test body.
tokio = { version = "1", features = ["macros", "rt"] }
# The in-process **mock relay** the client tests drill against (see
# src/remote/client/tests.rs) is deliberately the BLOCKING tungstenite server on
# a plain `std::thread`: the mock is a black-box peer, so keeping it independent
# of the client's own async machinery means a bug in that machinery cannot be
# masked by the harness sharing it. Pinned to the same 0.30 that
# tokio-tungstenite re-exports, so this adds no second WebSocket implementation
# to the graph — only the `handshake` (server upgrade) code path.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
