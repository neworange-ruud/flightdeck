siteTitle: Flightdeck Documentation
repositoryUrl: https://github.com/neworange-ruud/flightdeck
contentRoot: docs
mountPath: /docs

theme:
  defaultColorMode: system
  allowToggle: true

search:
  enabled: true

navigation:
  collapsible: true
  # Folded under "Advanced" in the sidebar so the Start Here / Everyday Use
  # path stays short. Every page is still in search and keeps its URL.
  collapsedSections:
    - Workers & Remote Hosts
    - More Features
    - Terminal UI
    - FlightDeck Web
    - FlightDeck Remote (iOS)
    - Reference

mdxComponents:
  enabled:
    - Callout
    - CardGrid
    - Card
    - Badge

codeBlocks:
  lineNumbers: optional
  copyButton: true
