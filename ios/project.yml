name: FlightDeckRemote
options:
  bundleIdPrefix: agency.neworange.flightdeck
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only, v1
    SWIFT_VERSION: "5.0" # see ios/README.md "Swift language mode" note
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_PREVIEWS: YES
    # DotTech Holding B.V. — the team that owns the
    # agency.neworange.flightdeck.remote bundle id and the APNs auth key the
    # relay signs with. A team id is not a secret (it ships inside every signed
    # binary), so it is committed to keep archive builds reproducible on any
    # machine or CI runner. Automatic signing lets Xcode mint the development or
    # distribution certificate + profile it needs per configuration.
    DEVELOPMENT_TEAM: "7NKCS4AZS9"
    CODE_SIGN_STYLE: Automatic
    # Signing is left ENABLED here so `xcodebuild archive` produces a signed,
    # uploadable app. The simulator test/build path opts out explicitly on the
    # command line instead (`CODE_SIGNING_ALLOWED=NO`, see scripts/test.sh and
    # the CI job), which keeps that path working without a certificate.
    CODE_SIGNING_ALLOWED: YES

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.14.0

targets:
  FlightDeckRemote:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlightDeckRemote
        excludes:
          - "Info.plist"
          - "FlightDeckRemote.entitlements"
          - "FlightDeckRemote-Release.entitlements"
    info:
      path: FlightDeckRemote/Info.plist
      properties:
        CFBundleDisplayName: "FlightDeck Remote"
        # Marketing version tracks the FlightDeck release train (Cargo.toml's
        # `version`); `scripts/release` rewrites both together so the phone and
        # the desktop never claim different versions. Surfaced in Settings →
        # About.
        CFBundleShortVersionString: "1.12.0"
        # Build number. Must strictly increase on EVERY App Store Connect
        # upload, independently of the marketing version — reusing one is
        # rejected. Bump this by hand per submitted build (or override it at
        # archive time with `CURRENT_PROJECT_VERSION`); `scripts/release` resets
        # it to 1 when the marketing version changes.
        CFBundleVersion: "1"
        # Export compliance (App Store Connect asks on every upload until this
        # is declared). All cryptography in the app is Apple's own CryptoKit
        # (X25519, HKDF-SHA256, ChaCha20-Poly1305) — no proprietary or
        # non-standard algorithms — which falls under the exemption for apps
        # using only encryption provided by the operating system.
        ITSAppUsesNonExemptEncryption: false
        # Hosted relay endpoint (remote-control-2mk). Committed here so the relay
        # address is a one-line plist edit, not a Swift source change. Read at
        # runtime via PairingDefaults.relayURL (Bundle.main). Points at the stable
        # custom domain (remote-control-edn) fronting the Azure Container Apps
        # relay, so it survives any rename/recreate of the Azure resources.
        FlightDeckRelayURL: "wss://relay.flightdeckai.app/ws"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Wake the app on a silent APNs push to reconnect + resume queued events
        # (spec §11); the relay's push is content-available (zero-knowledge).
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Permit ws:// to localhost / 127.0.0.1 for local relay dev and the
          # transport integration test. Does not relax ATS for any real host.
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: "Unlock FlightDeck Remote"
        NSCameraUsageDescription: "FlightDeck Remote uses the camera to scan the pairing QR code shown on your Mac."
        NSMicrophoneUsageDescription: "FlightDeck Remote uses the microphone so you can reply to agents by voice."
        NSSpeechRecognitionUsageDescription: "FlightDeck Remote uses speech recognition to turn your voice into a reply you can review before sending."
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        CFBundleURLTypes:
          - CFBundleURLName: agency.neworange.flightdeck.remote
            CFBundleURLSchemes:
              - flightdeck-remote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.neworange.flightdeck.remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
      # APNs entitlement (aps-environment), per configuration. It must MATCH the
      # environment the signing profile grants — development profiles grant
      # `development`, App Store / TestFlight distribution profiles grant
      # `production` — so Debug and Release cannot share one file. Only consumed
      # by the codesign step, which is skipped under CODE_SIGNING_ALLOWED=NO, so
      # the unsigned simulator build is unaffected either way.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: FlightDeckRemote/FlightDeckRemote.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: FlightDeckRemote/FlightDeckRemote-Release.entitlements
    dependencies:
      - package: SwiftTerm
    scheme:
      testTargets:
        - FlightDeckRemoteTests
        - FlightDeckRemoteUITests
      gatherCoverageData: true

  FlightDeckRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlightDeckRemoteTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.neworange.flightdeck.remote.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FlightDeckRemote

  FlightDeckRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlightDeckRemoteUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.neworange.flightdeck.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FlightDeckRemote
